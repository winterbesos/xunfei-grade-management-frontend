<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2025年度学业报告</title>
    <!-- 引入 ECharts -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <!-- 引入 Animate.css 用于基础动画库 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    
    <style>
        :root {
            --bg-deep: #0f0c29;
            --bg-mid: #302b63;
            --bg-light: #24243e;
            --accent-gold: #fbd786;
            --accent-pink: #f7797d;
            --text-main: #ffffff;
            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            background: linear-gradient(to bottom, var(--bg-deep), var(--bg-mid), var(--bg-light));
            font-family: 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif;
            color: var(--text-main);
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        /* 背景漂浮粒子 */
        .particles {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            overflow: hidden;
            z-index: 0;
            pointer-events: none;
        }
        .particle {
            position: absolute;
            background: rgba(255,255,255,0.3);
            border-radius: 50%;
            animation: floatUp infinite linear;
        }
        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            50% { opacity: 0.8; }
            100% { transform: translateY(-10vh) scale(1.5); opacity: 0; }
        }

        /* 音乐控制器 */
        .music-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 36px;
            height: 36px;
            z-index: 999;
            background: url('https://s1.ax1x.com/2023/01/01/pSjLZ4K.png') no-repeat center/contain; /* 简易唱片图标 */
            background-color: rgba(0,0,0,0.3);
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.3);
        }
        .music-btn.playing { animation: rotate 4s linear infinite; }
        @keyframes rotate { 100% { transform: rotate(360deg); } }

        /* 滑动容器 */
        .swiper-box {
            height: 100%;
            scroll-snap-type: y mandatory;
            overflow-y: scroll;
            scroll-behavior: smooth;
        }
        .swiper-box::-webkit-scrollbar { display: none; }

        /* 单页样式 */
        .page {
            height: 100vh;
            width: 100vw;
            scroll-snap-align: start;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center; /* 垂直居中 */
            padding: 30px;
            z-index: 10;
        }

        /* 进场动画基础类 - 初始隐藏 */
        .anim-item {
            opacity: 0;
            transform: translateY(30px);
            transition: all 1s cubic-bezier(0.22, 1, 0.36, 1);
        }
        /* 激活状态 */
        .page.active .anim-item {
            opacity: 1;
            transform: translateY(0);
        }
        /* 延迟控制 */
        .d-1 { transition-delay: 0.1s; }
        .d-2 { transition-delay: 0.3s; }
        .d-3 { transition-delay: 0.5s; }
        .d-4 { transition-delay: 0.7s; }
        .d-5 { transition-delay: 0.9s; }

        /* 文字排版 */
        h1 { font-size: 28px; margin-bottom: 10px; font-weight: 300; letter-spacing: 1px; }
        h2 { font-size: 20px; margin-bottom: 20px; color: #ccc; font-weight: 300; }
        .highlight-text { 
            font-size: 48px; 
            font-weight: bold; 
            background: linear-gradient(45deg, var(--accent-gold), var(--accent-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 10px 0;
            font-family: 'Impact', sans-serif;
        }
        .desc { font-size: 15px; line-height: 1.6; color: #ddd; margin-bottom: 10px; }

        /* 毛玻璃卡片 */
        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            width: 100%;
        }

        /* 成绩列表 */
        .grade-scroll {
            max-height: 45vh;
            overflow-y: auto;
            margin-top: 20px;
        }
        .grade-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .subject-name { font-size: 16px; color: #fff; }
        .grade-val { font-size: 18px; color: var(--accent-gold); font-weight: bold; }
        
        /* 引导遮罩层 */
        #startOverlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            z-index: 2000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.5s;
        }
        .start-btn {
            margin-top: 20px;
            padding: 10px 30px;
            border: 1px solid #fff;
            color: #fff;
            border-radius: 30px;
            font-size: 16px;
            cursor: pointer;
            animation: pulse 2s infinite;
        }

        /* 底部箭头 */
        .arrow-up {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 24px;
            height: 24px;
            border-top: 2px solid rgba(255,255,255,0.5);
            border-left: 2px solid rgba(255,255,255,0.5);
            transform: rotate(45deg);
            animation: arrowAnim 2s infinite;
            opacity: 0; /* JS控制显示 */
        }
        @keyframes arrowAnim {
            0% { transform: translateX(-50%) rotate(45deg) translate(0, 0); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translateX(-50%) rotate(45deg) translate(-10px, -10px); opacity: 0; }
        }

        /* 头像 */
        .avatar-box {
            width: 100px; height: 100px; 
            border-radius: 50%; 
            border: 2px solid rgba(255,255,255,0.8);
            margin: 0 auto 20px;
            overflow: hidden;
            display: flex; justify-content: center; align-items: center;
            font-size: 40px; background: rgba(255,255,255,0.2);
        }

    </style>
</head>
<body>

    <!-- 粒子背景 -->
    <div class="particles" id="particles"></div>

    <!-- 背景音乐 -->
    <audio id="bgm" loop>
        <!-- 这里使用一个免费的轻音乐链接，您可以替换成您的 mp3 -->
        <source src="https://music.163.com/song/media/outer/url?id=139774.mp3" type="audio/mpeg">
    </audio>
    <div class="music-btn" id="musicBtn" style="display:none;"></div>

    <!-- 启动页 (解决自动播放问题) -->
    <div id="startOverlay">
        <div style="font-size: 24px; letter-spacing: 2px; margin-bottom: 10px;">2025 年度学业报告</div>
        <div style="font-size: 14px; color: #999;">开启你的专属数据记忆</div>
        <div class="start-btn" onclick="startJourney()">点击开启</div>
    </div>

    <div class="swiper-box" id="swiperBox">
        
        <!-- P1: 封面 -->
        <div class="page active" id="page1">
            <div class="anim-item d-1 avatar-box">🎓</div>
            <div class="anim-item d-2" style="font-size: 20px; opacity: 0.8;">你好，<span id="p1_name" style="font-weight:bold;"></span></div>
            <div class="anim-item d-3">
                <h1 style="font-size: 32px; margin-top:10px;">这是你的<br>年度学业账单</h1>
            </div>
            <div class="anim-item d-4 desc" style="margin-top: 20px;">
                <span id="p1_school"></span><br>
                <span id="p1_year"></span>
            </div>
            <div class="anim-item d-5" style="margin-top: 40px; font-size: 12px; color:rgba(255,255,255,0.5);">
                向上滑动查看详情
            </div>
            <div class="arrow-up" style="opacity: 1;"></div>
        </div>

        <!-- P2: 总览数据 -->
        <div class="page">
            <div class="anim-item d-1 desc">这一学期</div>
            <div class="anim-item d-2 desc">你在知识的海洋里遨游</div>
            
            <div class="glass-card anim-item d-3" style="margin: 30px 0;">
                <div class="desc">平均绩点 (GPA) 达到</div>
                <div class="highlight-text" id="p2_gpa">0.0</div>
                <div class="desc" style="margin-top:20px;">累计获得学分</div>
                <div class="highlight-text" id="p2_credits" style="font-size: 36px;">0</div>
            </div>

            <div class="anim-item d-4 desc">
                每一分的耕耘，<br>都算数。
            </div>
            <div class="arrow-up"></div>
        </div>

        <!-- P3: 成绩单详情 -->
        <div class="page">
            <div class="anim-item d-1">
                <h1>成绩透视</h1>
                <p class="desc">你在这些课程中留下了足迹</p>
            </div>
            
            <div class="glass-card anim-item d-2" style="padding: 10px 20px;">
                <div class="grade-scroll" id="gradeList">
                    <!-- 动态插入 -->
                </div>
            </div>
            
            <div class="anim-item d-3 desc" style="margin-top: 20px; font-size: 12px; text-align: center;">
                * 仅展示已录入成绩的科目
            </div>
            <div class="arrow-up"></div>
        </div>

        <!-- P4: 雷达图 -->
        <div class="page">
            <div class="anim-item d-1">
                <h1>多维能力</h1>
                <p class="desc">不被定义，全面发展</p>
            </div>

            <div class="glass-card anim-item d-2" style="background: rgba(255,255,255,0.05);">
                <div id="radarChart" style="width: 100%; height: 320px;"></div>
            </div>

            <div class="anim-item d-3 desc" style="margin-top: 20px;">
                你的强项在于 <span style="color:var(--accent-gold); font-weight:bold;" id="strongAbility"></span>
            </div>
            <div class="arrow-up"></div>
        </div>

        <!-- P5: 评语与结尾 -->
        <div class="page">
            <div class="anim-item d-1" style="width: 100%;">
                <div class="desc">班主任 <span id="teacherName"></span> 写给你的话：</div>
                <div class="glass-card" style="margin-top: 15px; position: relative;">
                    <div style="font-size: 40px; position: absolute; top:-10px; left:10px; opacity:0.3;">“</div>
                    <div id="moralText" style="padding: 15px 5px; line-height: 1.8; font-style: italic;">
                        
                    </div>
                    <div style="font-size: 40px; position: absolute; bottom:-20px; right:10px; opacity:0.3;">”</div>
                </div>
            </div>

            <div class="anim-item d-3" style="margin-top: 50px; text-align: center;">
                <h1 style="font-size: 24px;">2026</h1>
                <p class="desc">保持热爱，奔赴山海</p>
                <div style="margin-top: 30px; font-size: 12px; color: #666;">
            <!-- Generated by Student Report System -->
                </div>
            </div>
        </div>

    </div>

<script>
    // 1. 数据注入 (JSON Data)
    const rawData = {
        "school_id": "9c5e8fc2cc6e5a1980b1d399283f58c1c859505cf637a597a3947114e5f5039bef8b25880db9570de472bef9130a470238f5f2315d02bb3c",
        "school_name": "上海师范大学附属虹口中学",
        "class_id": "fbc284072a40da8453575adf0806d35bc76e9061788182d07003a06bf1329977dacdb6801ffd9f91245b52fd702da1d36258b61da9eb340d",
        "class_name": "1班",
        "semester_id": "fbc284072a40da842499b27bd544445aa286500053bb38dcf1ef4577ba0a0093eae057116f0e65b5976bc9eaf39d4f21393405daf6ccf24d",
        "semester_name": "1-22周",
        "term_name": "第一学期",
        "year_name": "高一",
        "academic_year_name": "2025-2026学年",
        "student_id": "fbc284072a40da84013de8f267cbff8f878cf46b7c1d08b6a5f929926176d9966a829d13118c150b877d622da1965ea8f4eaa104ccb5b3a3",
        "student_name": "蔡欣妍",
        "header_teacher": "姚峻杰",
        "total_credits": "50.0",
        "average_gpa": "3.5",
        "grades": [
            { "subject_name": "英语", "score": "0.0", "usual_score": "50.0", "grade_level": "E", "midterm_score": null, "finalterm_score": null, "credits": "0.1" },
            { "subject_name": "政治", "score": null, "midterm_score": "74.6", "finalterm_score": "84.0", "usual_score": "25.1", "remarks": "sss" }
        ],
        "moral_education_comment": "该生在校期间表现良好，积极参与集体活动，学习态度端正，希望能保持热情，继续努力。", 
        "abilities": {
            "study_ability": 4,
            "logical_thinking": 3,
            "creativity": 2,
            "teamwork": 3,
            "responsibility": 3
        }
    };

    // 2. 逻辑处理
    
    // 初始化背景粒子
    function initParticles() {
        const container = document.getElementById('particles');
        for(let i=0; i<20; i++) {
            let p = document.createElement('div');
            p.className = 'particle';
            let size = Math.random() * 20 + 5;
            p.style.width = size + 'px';
            p.style.height = size + 'px';
            p.style.left = Math.random() * 100 + '%';
            p.style.animationDuration = (Math.random() * 10 + 5) + 's';
            p.style.animationDelay = (Math.random() * 5) + 's';
            container.appendChild(p);
        }
    }

    // 渲染数据
    function renderData() {
        // P1
        document.getElementById('p1_name').innerText = rawData.student_name;
        document.getElementById('p1_school').innerText = rawData.school_name;
        document.getElementById('p1_year').innerText = `${rawData.academic_year_name} ${rawData.term_name}`;

        // P2
        document.getElementById('p2_gpa').innerText = rawData.average_gpa || "-";
        document.getElementById('p2_credits').innerText = rawData.total_credits || "-";

        // P3 Grades
        const gradeList = document.getElementById('gradeList');
        let gradeHtml = '';
        rawData.grades.forEach(g => {
            // 智能显示分数逻辑
            let displayVal = g.score;
            if(!displayVal || displayVal === "0.0") {
                if(g.finalterm_score) displayVal = g.finalterm_score;
                else if(g.grade_level) displayVal = g.grade_level;
                else displayVal = "-";
            }
            gradeHtml += `
                <div class="grade-row">
                    <span class="subject-name">${g.subject_name}</span>
                    <span class="grade-val">${displayVal}</span>
                </div>
            `;
        });
        if(rawData.grades.length === 0) gradeHtml = "<div style='text-align:center;color:#666;'>暂无成绩</div>";
        gradeList.innerHTML = gradeHtml;

        // P4 Radar & Strongest Ability
        initRadar();
        
        // Find max ability
        const ab = rawData.abilities;
        const map = {
            "study_ability": "学习能力", "logical_thinking": "逻辑思维", 
            "creativity": "创造力", "teamwork": "团队合作", "responsibility": "责任感"
        };
        let maxVal = 0;
        let maxKey = "study_ability";
        for(let k in ab) {
            if(ab[k] > maxVal) {
                maxVal = ab[k];
                maxKey = k;
            }
        }
        document.getElementById('strongAbility').innerText = map[maxKey];

        // P5 Comment
        document.getElementById('teacherName').innerText = rawData.header_teacher;
        document.getElementById('moralText').innerText = rawData.moral_education_comment === "1231" ? "暂无详细评语" : rawData.moral_education_comment;
    }

    // 初始化雷达图
    function initRadar() {
        const chartDom = document.getElementById('radarChart');
        const myChart = echarts.init(chartDom);
        const ab = rawData.abilities;
        
        const option = {
            radar: {
                indicator: [
                    { name: '学习', max: 5 },
                    { name: '逻辑', max: 5 },
                    { name: '创造', max: 5 },
                    { name: '协作', max: 5 },
                    { name: '责任', max: 5 }
                ],
                splitNumber: 4,
                axisName: { color: '#fbd786', fontSize: 14 },
                splitLine: { lineStyle: { color: 'rgba(255,255,255,0.1)' } },
                splitArea: { show: false },
                axisLine: { lineStyle: { color: 'rgba(255,255,255,0.1)' } }
            },
            series: [{
                type: 'radar',
                data: [{
                    value: [ab.study_ability, ab.logical_thinking, ab.creativity, ab.teamwork, ab.responsibility],
                    name: '能力值',
                    areaStyle: { color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [{offset: 0, color: '#f7797d'}, {offset: 1, color: '#fbd786'}]) },
                    lineStyle: { width: 2, color: '#fbd786' },
                    itemStyle: { color: '#fff' }
                }]
            }]
        };
        myChart.setOption(option);
    }

    // 交互逻辑：启动体验
    function startJourney() {
        // 1. 播放音乐
        const bgm = document.getElementById('bgm');
        const btn = document.getElementById('musicBtn');
        bgm.play().then(() => {
            btn.classList.add('playing');
        }).catch(e => console.log("Autoplay blocked", e));
        
        btn.style.display = 'block';
        btn.onclick = () => {
            if(bgm.paused) {
                bgm.play();
                btn.classList.add('playing');
            } else {
                bgm.pause();
                btn.classList.remove('playing');
            }
        };

        // 2. 隐藏遮罩
        const overlay = document.getElementById('startOverlay');
        overlay.style.opacity = '0';
        setTimeout(() => overlay.remove(), 500);

        // 3. 触发首页动画
        setupScrollObserver();
    }

    // 滚动监听动画
    function setupScrollObserver() {
        const pages = document.querySelectorAll('.page');
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if(entry.isIntersecting) {
                    entry.target.classList.add('active');
                } else {
                    entry.target.classList.remove('active'); // 移出复位，以便重复播放
                }
            });
        }, { threshold: 0.4 });

        pages.forEach(p => observer.observe(p));
    }

    // 页面加载完成后执行
    window.onload = () => {
        initParticles();
        renderData();
    };

</script>
</body>
</html>
